[toolchain]
anchor_version = "1.0.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
webrush = "D2Jk64MauFmg8GhWoe7C2AqLFdQqjTayb5iy2hqrsBFS"

[programs.devnet]
# Deliberately a SEPARATE program ID from the shared devnet deployment used
# by every other branch -- see lib.rs declare_id! comment and README
# "Session keys" for why upgrading the shared program in place was proven
# unsafe rather than just assumed risky.
webrush = "D2Jk64MauFmg8GhWoe7C2AqLFdQqjTayb5iy2hqrsBFS"

[registry]
url = "https://api.apr.dev"

# Clones MagicBlock's gpl_session program (used by @magicblock-labs/gum-sdk
# for session-token creation/validation) from devnet onto the local test
# validator, so session-key flows can be tested on localnet -- fresh test
# validators don't have it deployed otherwise.
[[test.validator.clone]]
address = "KeyspM2ssCJbqUhQ4k7sveSiY4WjnYsrXkC8oDbwde5"

[test.validator]
url = "https://api.devnet.solana.com"

[provider]
# Local dev/test loop runs against solana-test-validator (fast, free, and
# doesn't touch devnet SOL). Switch this to "devnet" for the real deploy --
# see README "Deploying to devnet".
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
