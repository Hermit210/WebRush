[toolchain]
anchor_version = "1.0.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
webrush = "8o3RF97HDqRQ7jVEviaYDmiMnGVCwck22XeezGwkYNnU"

[programs.devnet]
webrush = "8o3RF97HDqRQ7jVEviaYDmiMnGVCwck22XeezGwkYNnU"

[registry]
url = "https://api.apr.dev"

[provider]
# Local dev/test loop runs against solana-test-validator (fast, free, and
# doesn't touch devnet SOL). Switch this to "devnet" for the real deploy --
# see README "Deploying to devnet".
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
